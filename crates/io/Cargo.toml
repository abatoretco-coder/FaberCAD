[package]
name = "solidcraft-io"
description = "SolidCraft file formats: designs (JSON), STL, OBJ, STEP, IGES, 3MF and glTF, and FreeCAD/Rhino import"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
# Secondary open-format decoders; normal STEP/native design IO is independent.
foreign-cad-import = ["dep:cadmpeg-core", "dep:cadmpeg-ir", "dep:cadmpeg-registry"]
# Tests only: trust a model cache even when the build has no git commit.
trust-unknown-source = []

[dependencies]
solidcore-record = { workspace = true }
solidcraft-geom = { workspace = true }
solidcraft-kernel = { workspace = true }
solidcraft-doc = { workspace = true }
solidcraft-profile = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
zip = { workspace = true }
quick-xml = { workspace = true }
gltf = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = { workspace = true }
chardetng = { workspace = true }
encoding_rs = { workspace = true }
# Optional pure-Rust secondary decoders, also available to opted-in browser builds.
cadmpeg-core = { workspace = true, optional = true }
cadmpeg-ir = { workspace = true, optional = true }
cadmpeg-registry = { workspace = true, optional = true }

# The model cache's key (build.rs).
[build-dependencies]
sha2 = { workspace = true }

# A plain fsync where a network share refuses Apple's full flush (src/safe_write.rs); already in
# the tree through tempfile.
[target.'cfg(target_vendor = "apple")'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "fs"] }

# The computer's name for a design's lock file (src/design_lock.rs; the browser keeps no lock files).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gethostname = { workspace = true }

[dev-dependencies]
solidcraft-testkit = { workspace = true }
